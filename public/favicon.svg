<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2035;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="16" cy="16" r="15" fill="url(#grad)" stroke="#fff" stroke-width="1"/>
  
  <!-- 彩票图标 -->
  <rect x="8" y="10" width="16" height="12" rx="2" fill="#fff" opacity="0.9"/>
  <rect x="9" y="11" width="14" height="10" rx="1" fill="none" stroke="#0052d9" stroke-width="1"/>
  
  <!-- 数字点 -->
  <circle cx="12" cy="14" r="1.5" fill="#0052d9"/>
  <circle cx="16" cy="14" r="1.5" fill="#0052d9"/>
  <circle cx="20" cy="14" r="1.5" fill="#0052d9"/>
  
  <!-- 分割线 -->
  <line x1="10" y1="17" x2="22" y2="17" stroke="#0052d9" stroke-width="0.5" stroke-dasharray="1,1"/>
  
  <!-- 底部数字 -->
  <circle cx="14" cy="19" r="1" fill="#1a2035"/>
  <circle cx="18" cy="19" r="1" fill="#1a2035"/>
</svg>